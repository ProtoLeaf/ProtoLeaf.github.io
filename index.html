<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个简洁、现代的 Markdown 博客">
  <title>我的博客</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">我的博客</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="切换深色模式" title="切换主题">☾</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <p class="eyebrow">WELCOME TO MY BLOG</p>
        <h1>记录想法，分享知识。</h1>
        <p class="hero-text">这里是我的个人博客，用 Markdown 写作，让内容简单、自由地发布。</p>
      </div>
    </section>

    <section class="container posts-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">LATEST POSTS</p>
          <h2>最新文章</h2>
        </div>
        <label class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="搜索文章..." aria-label="搜索文章">
        </label>
      </div>

      <div id="postList" class="post-grid" aria-live="polite"></div>
      <div id="emptyState" class="empty-state hidden">没有找到相关文章。</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> 我的博客</span>
      <a href="about.html">关于本站</a>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
