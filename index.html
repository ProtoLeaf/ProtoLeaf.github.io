<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人博客</title>
    <!-- 引入 Tailwind CSS 让排版瞬间变高级 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Marked.js 用于解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- 顶部导航栏 -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="#" onclick="loadHome()" class="text-xl font-bold tracking-tight text-gray-900">✨ 我的私人博客</a>
            <nav class="text-sm text-gray-600 space-x-4">
                <a href="#" onclick="loadHome()" class="hover:text-blue-600 transition">首页</a>
                <a href="https://github.com/你的用户名" target="_blank" class="hover:text-blue-600 transition">GitHub</a>
            </nav>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-3xl w-full mx-auto px-6 py-10 flex-grow">
        <div id="content">
            <!-- 动态加载的内容会在这里显示 -->
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="border-t border-gray-200 py-6 text-center text-xs text-gray-400">
        <p>&copy; 2026 我的私人博客. Hosted on GitHub Pages.</p>
    </footer>

    <!-- 核心逻辑脚本 -->
    <script>
        // 📌 在这里配置你的文章列表！每次写完新文章，在这里加一行标题和文件名即可。
        const posts = [
            { title: "第一篇博客：Hello World", date: "2026-08-26", file: "posts/hello.md" },
            // 以后写新文章，格式照着上面加：
            // { title: "文章标题", date: "2026-08-27", file: "posts/your-filename.md" }
        ];

        function loadHome() {
            let html = `<h2 class="text-2xl font-bold mb-6 text-gray-900">文章列表</h2>`;
            html += `<div class="space-y-4">`;
            posts.forEach((post, index) => {
                html += `
                    <div class="bg-white p-6 rounded-xl border border-gray-200 hover:shadow-md transition cursor-pointer" onclick="loadPost(${index})">
                        <span class="text-xs text-gray-400">${post.date}</span>
                        <h3 class="text-lg font-semibold text-gray-800 mt-1 hover:text-blue-600">${post.title}</h3>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('content').innerHTML = html;
        }

        function loadPost(index) {
            const post = posts[index];
            // 异步加载对应的 markdown 文件
            fetch(post.file)
                .then(response => {
                    if (!response.ok) throw new Error("文章加载失败");
                    return response.text();
                })
                .then(text => {
                    document.getElementById('content').innerHTML = `
                        <button onclick="loadHome()" class="mb-6 text-sm text-blue-600 hover:underline">&larr; 返回文章列表</button>
                        <span class="text-xs text-gray-400">${post.date}</span>
                        <h1 class="text-3xl font-bold text-gray-900 mt-1 mb-6">${post.title}</h1>
                        <article class="prose max-w-none text-gray-700 leading-relaxed space-y-4">
                            ${marked.parse(text)}
                        </article>
                    `;
                })
                .catch(err => {
                    document.getElementById('content').innerHTML = `<p class="text-red-500">无法加载该文章，请检查文件路径是否正确。</p><button onclick="loadHome()" class="mt-4 text-sm text-blue-600 hover:underline">&larr; 返回</button>`;
                });
        }

        // 页面刚打开时加载首页
        loadHome();
    </script>
</body>
</html>
