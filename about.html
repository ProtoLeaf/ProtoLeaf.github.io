<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="关于我的博客">
  <title>关于 · 我的博客</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">我的博客</a>
      <nav>
        <a href="index.html">首页</a>
        <a class="active" href="about.html">关于</a>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="切换深色模式" title="切换主题">☾</button>
      </nav>
    </div>
  </header>

  <main class="container page">
    <article class="content-card">
      <p class="eyebrow">ABOUT</p>
      <h1>关于本站</h1>
      <p>这是一个基于 GitHub Pages 的静态 Markdown 博客。</p>

      <h2>如何写文章？</h2>
      <p>只需要在 <code>posts/</code> 文件夹中添加 Markdown 文件，然后在 <code>assets/js/app.js</code> 的文章列表中登记文件名和基本信息即可。</p>

      <h2>技术栈</h2>
      <ul>
        <li>HTML5</li>
        <li>CSS3</li>
        <li>原生 JavaScript</li>
        <li>Markdown + Marked.js</li>
        <li>GitHub Pages</li>
      </ul>

      <h2>主题模式</h2>
      <p>点击右上角的月亮/太阳按钮即可手动切换浅色和深色模式。选择会保存在浏览器本地。</p>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> 我的博客</span>
      <a href="index.html">返回首页</a>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
